name: NotesQuick
options:
  bundleIdPrefix: com.notesquick
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  NotesQuickMac:
    type: application
    platform: macOS
    sources:
      - NotesQuick/Models
      - NotesQuick/ViewModels
      - NotesQuick/Utilities
      - NotesQuick/Extensions
      - NotesQuick/Views
      - NotesQuickMac/App
      - NotesQuickMac/Views
      - NotesQuickMac/Resources
    settings:
      base:
        PRODUCT_NAME: NotesQuick
        PRODUCT_BUNDLE_IDENTIFIER: com.notesquick.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "24"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "P87G25W6U3"
        CODE_SIGN_ENTITLEMENTS: NotesQuickMac.entitlements
    dependencies:
      - target: NotesQuickShareMac
        embed: true

  NotesQuickShareMac:
    type: app-extension
    platform: macOS
    sources:
      - NotesQuickShareMac/ShareViewController.swift
      - NotesQuick/Utilities/AppGroup.swift
      - NotesQuick/Utilities/FolderBookmark.swift
      - NotesQuick/Utilities/NoteFolder.swift
    info:
      path: NotesQuickShareMac/Info.plist
      properties:
        CFBundleDisplayName: NotesQuick
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    settings:
      base:
        PRODUCT_NAME: NotesQuickShareMac
        PRODUCT_BUNDLE_IDENTIFIER: com.notesquick.app.sharemac
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "24"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "P87G25W6U3"
        CODE_SIGN_ENTITLEMENTS: NotesQuickShareMac.entitlements

  NotesQuickiOS:
    type: application
    platform: iOS
    sources:
      - NotesQuick/Models
      - NotesQuick/ViewModels
      - NotesQuick/Utilities
      - NotesQuick/Extensions
      - NotesQuick/Views
      - NotesQuickiOS/App
      - NotesQuickiOS/Views
      - NotesQuickiOS/Resources
    settings:
      base:
        PRODUCT_NAME: NotesQuick
        PRODUCT_BUNDLE_IDENTIFIER: com.notesquick.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "24"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "P87G25W6U3"
        CODE_SIGN_ENTITLEMENTS: NotesQuickiOS.entitlements
    dependencies:
      - target: NotesQuickShareiOS
        embed: true

  NotesQuickShareiOS:
    type: app-extension
    platform: iOS
    sources:
      - NotesQuickShareiOS/ShareViewController.swift
      - NotesQuick/Utilities/AppGroup.swift
      - NotesQuick/Utilities/FolderBookmark.swift
      - NotesQuick/Utilities/NoteFolder.swift
    info:
      path: NotesQuickShareiOS/Info.plist
      properties:
        CFBundleDisplayName: NotesQuick
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    settings:
      base:
        PRODUCT_NAME: NotesQuickShareiOS
        PRODUCT_BUNDLE_IDENTIFIER: com.notesquick.app.shareios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "24"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "P87G25W6U3"
        CODE_SIGN_ENTITLEMENTS: NotesQuickShareiOS.entitlements
